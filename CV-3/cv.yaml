    research_experience:
      - company: Joe DiMaggio Children's Hospital
        position: Research Assistant, Pediatric Immunology & Allergy
        start_date: 2025
        end_date: present
        location: Hollywood, FL
        summary: 'Advisor: Christopher Chang, MD, PhD, MBA'
        highlights:
          - '**Project Focus:** Population-level clinical research using Epic
            Cosmos, a national de-identified EHR database (>277M patients; >9B
            encounters).'
          - '**Responsibilities:** Lead projects from hypothesis development
            through feasibility queries, dataset extraction, and analysis; draft
            manuscripts and abstracts translating epidemiological findings into
            clinically actionable insights.'
          - '**Outcomes:** Poster presented at the Society for Investigative
            Dermatology Annual Meeting (May 2026); multiple manuscripts in
            progress.'
      - company: Yale School of Medicine
        position: Research Associate, Emergency Medicine
        start_date: 2022
        end_date: 2023
        location: New Haven, CT
        summary: 'Advisor: Basmah Safdar, MD'
        highlights:
          - '**Project Focus:** Multi-center CDC-funded surveillance studies
            (IVY-5/IVY-6) on respiratory virus outcomes (influenza, COVID-19,
            RSV) and sex-based differences in recovery following cardiac
            surgery.'
          - '**Responsibilities:** Conducted clinical data abstraction and
            specimen collection for hospitalized patient enrollment; managed
            data and coordinated large-scale national epidemiological analyses.'
          - '**Outcomes:** Co-author on three peer-reviewed publications in
            Clinical Therapeutics (2025) and Clinical Infectious Diseases (2024,
            2025).'
      - company: Dade County Street Response
        position: Clinical Research Coordinator, Street Medicine
        start_date: 2021
        end_date: 2023
        location: Miami, FL
        summary: 'Advisor: Armen Henderson, MD'
        highlights:
          - '**Project Focus:** Community-based research assessing health needs
            among people experiencing homelessness in Miami-Dade County.'
          - '**Responsibilities:** Designed and managed REDCap databases for
            dermatologic research; led needs assessments identifying gaps in
            vision and skin care access; coordinated prospective data collection
            at mobile clinics while delivering wound care and skin cancer
            referrals.'
          - '**Outcomes:** Three poster presentations at national conferences
            (APSA, AAMC GSA/OSR, Innovations in Medical Education); published
            community ophthalmology needs assessment report.'
      - company: Florida State University
        position: Undergraduate Research Associate, Department of Biological Science
        start_date: 2017
        end_date: 2020
        location: Tallahassee, FL
        summary: 'Advisor: Lisa Lyons, PhD'
        highlights:
          - '**Project Focus:** Effects of sleep deprivation on RNA-binding
            proteins (hnRNP A2/B1, hnRNP DL) in C57BL/6 mouse brain regions,
            evaluating mechanisms of memory and circadian regulation.'
          - '**Responsibilities:** Performed Western blotting, Bradford protein
            assays, and subcellular protein fractionation to analyze neuronal
            protein expression.'
          - '**Outcomes:** Poster presented at the 19th Annual FSU Undergraduate
            Research Symposium (April 2019).'
